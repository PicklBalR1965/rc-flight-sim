<style>
  :root { --ui: rgba(12, 28, 44, .62); --line: rgba(255,255,255,.22); --accent: #ffcf3a; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9cc9ef;
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; color: #fff;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; touch-action: none; }
  body.playing { touch-action: none; overflow: hidden; }
  body:not(.playing) { overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .hud { position: fixed; z-index: 5; pointer-events: none; }
  #stats { top: calc(env(safe-area-inset-top) + 10px); left: calc(env(safe-area-inset-left) + 10px);
    background: var(--ui); border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px;
    display: grid; grid-template-columns: auto auto; gap: 2px 12px; font-size: 13px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #stats b { font-variant-numeric: tabular-nums; font-size: 15px; }
  #stats .k { opacity: .7; }
  #stats .warn { color: #ff6b5b; animation: blink .6s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  #planeName { grid-column: 1 / 3; font-weight: 700; font-size: 12px; letter-spacing: .04em; color: var(--accent); }
  #topbtns { top: calc(env(safe-area-inset-top) + 10px); right: calc(env(safe-area-inset-right) + 10px);
    display: flex; gap: 8px; pointer-events: auto; flex-wrap: wrap; justify-content: flex-end; max-width: 60vw; }
  .tb { background: var(--ui); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; font-size: 13px;
    font-weight: 600; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .tb.on { background: rgba(255, 207, 58, .9); color: #10202e; }
  .tb.hot { background: #2fbf6b; }
  #msg { top: 22%; left: 50%; transform: translateX(-50%); font-size: 26px; font-weight: 800; text-align: center;
    text-shadow: 0 2px 10px rgba(0,0,0,.45); transition: opacity .3s; opacity: 0; white-space: pre-line; }
  #ringInfo { top: calc(env(safe-area-inset-top) + 12px); left: 50%; transform: translateX(-50%);
    background: var(--ui); border-radius: 12px; padding: 6px 14px; font-weight: 700; font-size: 15px; display: none;
    font-variant-numeric: tabular-nums; }
  #marker { width: 34px; height: 34px; margin: -17px 0 0 -17px; border: 3px solid var(--accent); border-radius: 50%;
    display: none; box-shadow: 0 0 8px rgba(0,0,0,.4); }
  #marker.arrow { border-radius: 0; border: none; width: 0; height: 0; margin: -14px 0 0 -10px;
    border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 28px solid var(--accent); }
  .stick { position: fixed; bottom: calc(env(safe-area-inset-bottom) + 18px); z-index: 6; width: 170px; height: 170px;
    border-radius: 34px; background: rgba(15, 20, 28, .55); border: 2px solid var(--line); touch-action: none; }
  #stickL { left: calc(env(safe-area-inset-left) + 18px); }
  #stickR { right: calc(env(safe-area-inset-right) + 18px); border-radius: 50%; }
  .stick .knob { position: absolute; width: 64px; height: 64px; left: 50%; top: 50%; margin: -32px 0 0 -32px;
    border-radius: 50%; background: radial-gradient(circle at 35% 30%, #5b6574, #1d222b 70%);
    border: 2px solid rgba(255,255,255,.35); box-shadow: 0 4px 12px rgba(0,0,0,.5); pointer-events: none; }
  .stick .knob::after { content: ""; position: absolute; inset: 14px; border-radius: 50%;
    background: repeating-radial-gradient(circle, #2a313b 0 2px, #3a434f 2px 4px); }
  .stick .cross { position: absolute; inset: 14px; pointer-events: none; opacity: .35;
    background: linear-gradient(#fff,#fff) center/2px 100% no-repeat, linear-gradient(#fff,#fff) center/100% 2px no-repeat; }
  .stick label { position: absolute; bottom: 100%; left: 0; right: 0; margin-bottom: 6px; text-align: center;
    font-size: 11px; font-weight: 700; letter-spacing: .06em; text-shadow: 0 1px 4px rgba(0,0,0,.7); pointer-events: none; }
  #thrBar { position: absolute; left: -16px; top: 10px; bottom: 10px; width: 8px; border-radius: 4px;
    background: rgba(0,0,0,.4); overflow: hidden; pointer-events: none; }
  #thrBar i { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(#ffcf3a, #ff7b2e); }
  #menu { position: fixed; top: 0; left: 0; right: 0; bottom: 0; height: 100%; height: 100dvh; z-index: 20; display: block; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y;
    padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 30px); box-sizing: border-box; background: radial-gradient(ellipse at top, rgba(20,60,90,.7), rgba(5,15,25,.88)); }
  #menu.hidden { display: none; }
  .card { width: min(760px, 94vw); padding: 22px 24px 20px; margin: 20px auto; box-sizing: border-box; background: rgba(10, 24, 38, .85);
    border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .card h1 { margin: 0; font-size: 30px; letter-spacing: -.01em; }
  .card h1 span { color: var(--accent); }
  .card .sub { opacity: .75; margin: 2px 0 16px; font-size: 14px; }
  .card h3 { margin: 16px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; opacity: .7; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .opt { flex: 1 1 150px; background: rgba(255,255,255,.07); border: 2px solid transparent; border-radius: 14px;
    padding: 10px 12px; text-align: left; }
  .opt.sel { border-color: var(--accent); background: rgba(255, 207, 58, .14); }
  .opt .t { font-weight: 700; font-size: 15px; }
  .opt .d { font-size: 12px; opacity: .72; margin-top: 2px; }
  .opt svg { width: 100%; height: 54px; display: block; margin-bottom: 6px; }
  .opt[disabled] { opacity: .35; }
  .toggles { display: flex; gap: 10px; flex-wrap: wrap; }
  .tog { flex: 1 1 200px; display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.07);
    border-radius: 12px; padding: 10px 12px; font-size: 14px; border: none; text-align: left; }
  .tog i { flex: none; width: 40px; height: 24px; border-radius: 12px; background: #4a5563; position: relative; transition: background .2s; }
  .tog i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .2s; }
  .tog.on i { background: #2fbf6b; }
  .tog.on i::after { left: 19px; }
  .tog small { display: block; opacity: .65; font-size: 11px; }
  #go { margin-top: 18px; width: 100%; padding: 15px; border: none; border-radius: 14px; font-size: 19px; font-weight: 800;
    background: linear-gradient(#ffd94f, #ffb52e); color: #1b2633; }
  .help { font-size: 13px; line-height: 1.5; opacity: .85; margin: 0; padding-left: 18px; }
  .help b { color: var(--accent); }

  #feed { top: calc(env(safe-area-inset-top) + 52px); left: 50%; transform: translateX(-50%); text-align: center; font-weight: 700; font-size: 15px; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  #feed div { transition: opacity .5s; color: #ffd94f; }
  #lock { width: 46px; height: 46px; margin: -23px 0 0 -23px; border: 3px solid #ff3b30; display: none; }
  .fbtn { position: fixed; z-index: 6; right: calc(env(safe-area-inset-right) + 200px); border: 2px solid rgba(255,255,255,.4); color: #fff; font-weight: 800; touch-action: none; }
  #bFire { bottom: calc(env(safe-area-inset-bottom) + 30px); width: 92px; height: 92px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #ff6a5a, #c4241a); font-size: 18px; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
  #bAlt { bottom: calc(env(safe-area-inset-bottom) + 132px); padding: 10px 14px; border-radius: 14px; background: rgba(40,40,46,.8); font-size: 14px; }
  .fbtn.down { filter: brightness(1.4); transform: scale(.95); }
  #card { position: fixed; z-index: 7; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); transform: translate(-50%, 30px); width: min(460px, calc(100vw - 420px)); min-width: 260px;
    background: rgba(10,24,38,.88); border: 1px solid var(--line); border-left: 5px solid #3ccf6e; border-radius: 16px; padding: 12px 16px; opacity: 0; transition: all .4s; pointer-events: none; }
  #card.show { opacity: 1; transform: translate(-50%, 0); }
  #card b { display: block; font-size: 18px; color: #ffd94f; margin-bottom: 4px; }
  #card span { font-size: 14px; line-height: 1.4; }
  .opt svg { height: 44px; }
  #planeRow .opt { flex: 1 1 140px; }
  @media (max-width: 700px) { #card { width: calc(100vw - 40px); bottom: 210px; } .fbtn { right: 20px; } #bFire { bottom: 210px; width: 70px; height: 70px; } #bAlt { bottom: 290px; } }
  @media (max-height: 520px) { .stick { width: 140px; height: 140px; } .stick .knob { width: 54px; height: 54px; margin: -27px 0 0 -27px; } }

  /* ---- phones ---- */
  @media (max-width: 600px), (max-height: 500px) {
    #stats { padding: 5px 8px; font-size: 10px; gap: 0 8px; border-radius: 10px; }
    #stats b { font-size: 11px; }
    #planeName { font-size: 9px; }
    #topbtns { gap: 4px; max-width: 55vw; }
    .tb { padding: 5px 8px; font-size: 11px; border-radius: 9px; }
    #msg { font-size: 17px; }
    #ringInfo { font-size: 12px; padding: 4px 10px; top: calc(env(safe-area-inset-top) + 46px); }
    .card { padding: 14px 14px; margin: 12px auto; } .card h1 { font-size: 22px; } .card .sub { font-size: 12px; margin-bottom: 10px; } .opt svg { height: 30px; margin-bottom: 2px; }
    .opt { padding: 7px 9px; flex-basis: 130px; } .opt .t { font-size: 13px; } .opt .d { font-size: 10.5px; } .help { font-size: 12px; } #go { padding: 12px; font-size: 17px; margin-top: 12px; }

    var m = S.motor * (S.type === 'seaplane' ? (1 + (i ? -1 : 1) * S.steer * 0.4) : 1);
    p.rotation.z = spin * (i % 2 ? -1 : 1) * (heliish && i === 0 ? 0.25 : 0.7 + m * 0.3);
    p.userData.disc.material.opacity = m > 0.25 ? 0.12 + m * 0.12 : 0;
    p.userData.blades.visible = m < 0.6 || (heliish && i === 0);
  });
  if (A.elev) A.elev.rotation.x = S.elev * 0.45;
  if (A.ailL) { var f = A.ailFlip ? -1 : 1; A.ailL.rotation.x = -S.steer * 0.4 * f; A.ailR.rotation.x = S.steer * 0.4 * f; }
  if (A.rud) A.rud.rotation.y = S.rud * 0.5;
  if (A.glow) A.glow.material.opacity = S.motor * 0.9;
  if (A.nac) { nacAng += ((S.vtol ? -Math.PI / 2 : 0) - nacAng) * Math.min(1, dt * 2); A.nac.forEach(function (n) { n.rotation.x = nacAng; }); }
}

function handleEvent(ev) {
  if (!ev) return;
  var wtr = H(S.pos.x, S.pos.z) < 0;
  if (ev === 'crash') { game.resetT = 2.3; wobble = 0; burst(S.pos, wtr ? 120 : 40, wtr ? 6 : 3, wtr ? null : [0.6, 0.5, 0.4]); toast(wtr ? '💦 Splash! Crashed into the lake' : '💥 Crash! (foam bounces back)', 2.2); beep(140, 0.4); }
  else if (ev === 'sink') { game.resetT = 2.6; burst(S.pos, 140, 6); toast('💦 Wheels don\'t float!\nOnly the seaplane can land on the lake.', 2.6); beep(140, 0.4); }
  else if (ev === 'flip') { game.resetT = 2.5; burst(S.pos, 60, 4); toast('Flipped over!\nRighting it…', 2.2); }
  else if (ev === 'takeoff') { if (!TOUR) toast('Airborne! ✈︎', 1.2); }
  else if ((ev === 'splashdown' || ev === 'touchdown') && game.airT > 3) {
    var rl = PHYS.rwyLocal(S.pos.x, S.pos.z), onRwy = Math.abs(rl.u) < RWY.len / 2 && Math.abs(rl.v) < RWY.wid;
    if (TOUR && ringRun.done && onRwy) {
      var tm = ringRun.t, nb = !ringRun.best || tm < ringRun.best;
      if (nb) { ringRun.best = tm; try { localStorage.setItem('drc-tour-best', JSON.stringify(tm)); } catch (e) {} }
      showCard('Tour complete! 🎉', 'Welcome back to Doylestown Airport. Thanks for visiting Camp Curiosity, Curiosity Academy and Doylestown Pickleball! Tour time: ' + Math.round(tm) + 's.', 10);
      ringRun.done = false; ringRun.idx = rings.length + 1; $('ringInfo').textContent = 'Tour complete · ' + Math.round(tm) + 's'; beep(784, 0.12); beep(988, 0.12, 0.13); beep(1319, 0.25, 0.26);
    } else toast(ev === 'splashdown' ? 'Nice water landing! 🌊' : onRwy ? 'Smooth landing! 🛬' : 'Landed! 🌱', 1.6);
  }
}

// ---------------- Camera & render ----------------
function updateCamera(dt) {
  var A = models[S.type].A, sc = T[S.type].scale;
  tmpF.set(0, 0, 1).applyQuaternion(S.q);
  if (game.cam === 0) {
    var flat = tmpV.copy(tmpF).setY(0);
    if (flat.lengthSq() > 0.01 && S.state === 'ok') { flat.normalize(); camHead.lerp(flat, 1 - Math.exp(-dt * 3)).normalize(); }
    var dist = 2.2 * sc + 1.2;
    var want = tmpU.copy(S.pos).addScaledVector(camHead, -dist); want.y += 0.65 * sc + 0.4;
    camera.position.lerp(want, 1 - Math.exp(-dt * 5));
    var floor = G(camera.position.x, camera.position.z) + 0.4; if (camera.position.y < floor) camera.position.y = floor;
    lookAt.copy(S.pos).addScaledVector(tmpF, 0.6 * sc); lookAt.y += 0.15 * sc; camera.lookAt(lookAt); setFov(62, dt); pilot.visible = true;
  } else if (game.cam === 1) {
    camera.position.set(PHYS.PILOT.x, PHYS.PILOT.y, PHYS.PILOT.z); camera.lookAt(S.pos);
    setFov(clamp(2 * Math.atan(5 * sc / camera.position.distanceTo(S.pos)) * 57.3, 8, 65), dt); pilot.visible = false;
  } else {
    camera.position.copy(A.fpv).multiplyScalar(sc).applyQuaternion(S.q).add(S.pos);
    camera.quaternion.copy(S.q).multiply(yawQ(Math.PI)); setFov(75, dt); pilot.visible = true;
  }
}
function setFov(f, dt) { camera.fov += (f - camera.fov) * Math.min(1, dt * 4); camera.updateProjectionMatrix(); }
function screenPt(p, el) {
  tmpV.copy(p).project(camera); var behind = tmpV.z > 1, x = tmpV.x, y = tmpV.y; if (behind) { x = -x; y = -y; }
  return { on: !behind && Math.abs(x) < 0.92 && Math.abs(y) < 0.9, x: x, y: y };
}
function updateMarkers() {
  var mk = $('marker');
  if (!ringRun.on || !game.playing || ringRun.idx >= rings.length) mk.style.display = 'none';
  else {
    var s = screenPt(rings[ringRun.idx].position); mk.style.display = 'block';
    if (s.on) { mk.className = 'hud'; mk.style.left = ((s.x + 1) / 2 * innerWidth) + 'px'; mk.style.top = ((1 - s.y) / 2 * innerHeight) + 'px'; mk.style.transform = ''; }
    else { var a = Math.atan2(s.y, s.x), m = Math.max(Math.abs(Math.cos(a)) / 0.85, Math.abs(Math.sin(a)) / 0.8);
      mk.className = 'hud arrow'; mk.style.left = ((Math.cos(a) / m + 1) / 2 * innerWidth) + 'px'; mk.style.top = ((1 - Math.sin(a) / m) / 2 * innerHeight) + 'px'; mk.style.transform = 'rotate(' + (90 - a * 57.3) + 'deg)'; }
  }
  var lk = $('lock');
  if (lockT && game.playing) { var q = screenPt(lockT.c); if (q.on) { lk.style.display = 'block'; lk.style.left = ((q.x + 1) / 2 * innerWidth) + 'px'; lk.style.top = ((1 - q.y) / 2 * innerHeight) + 'px'; } else lk.style.display = 'none'; }
  else lk.style.display = 'none';
}
function render(dt) {
  var model = models[S.type];
  model.root.position.copy(S.pos); model.root.quaternion.copy(S.q);
  if (S.state === 'crash') model.root.rotateZ(Math.sin(wobble) * 0.3 + 0.6);
  if (S.state === 'flip') model.root.rotateZ(Math.PI);
  animate(model.A, dt);
  var gH = G(S.pos.x, S.pos.z), hgt = S.pos.y - gH, sc = T[S.type].scale;
  GFX.follow(sun, S.pos, 30 + sc * 10);
  shadow.position.set(S.pos.x, gH + 0.08, S.pos.z); shadow.material.opacity = hgt < 60 ? 0 : clamp(0.32 - hgt * 0.004, 0, 0.25); shadow.scale.setScalar(sc * (0.8 + hgt * 0.01));
  pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true;
  updateCamera(dt); updateMarkers(); updateAudio();
  labels.forEach(function (l) { var d = l.position.distanceTo(camera.position); l.visible = d < 1400 && d > 45; var s = clamp(d / 22, 14, 60); l.scale.set(s * 5.3, s, 1); });
  sky.position.copy(camera.position);
  renderer.render(scene, camera);
}
var last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  var dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render(dt);
}
// test hook: run the sim fast without drawing
window.__sim = function (secs, cfg) {
  if (cfg) { Object.assign(game, cfg); spawn(); game.playing = true; game.paused = false; $('menu').classList.add('hidden'); document.body.classList.add('playing'); }
  for (var t = 0; t < secs; t += 1 / 60) update(1 / 60);
  var rl = PHYS.rwyLocal(S.pos.x, S.pos.z);
  return { x: Math.round(S.pos.x), y: +S.pos.y.toFixed(1), z: Math.round(S.pos.z), v: +S.vel.length().toFixed(1), state: S.state, ring: ringRun.idx, done: ringRun.done, onS: S.onSurface, u: Math.round(rl.u), lat: +rl.v.toFixed(1), score: game.score };
};
window.__game = game; window.__S = S; window.__input = input; window.__targets = targets; window.__models = models;

buildMenu(); syncBtns(); spawn(); if (!TOUR) { updScore(); stopRings(); ringRun.on = false; }
requestAnimationFrame(frame);
})();
